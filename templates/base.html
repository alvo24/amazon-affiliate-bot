<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Amazon Affiliate Bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
  </div>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-text">Affiliate Bot</span>
      </a>
      <div class="nav-links">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
          
          Dashboard
        </a>
        <a href="/post-link" class="{% if request.url.path == '/post-link' %}active{% endif %}">
          
          Post a link
        </a>
        <a href="/products" class="{% if request.url.path == '/products' %}active{% endif %}">
          
          Products
        </a>
        <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">
          
          Settings
        </a>
        <form method="post" action="/logout" style="display:inline;margin:0">
          <button type="submit" class="link-button" title="Sign out">
            
            Logout
          </button>
        </form>
      </div>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
