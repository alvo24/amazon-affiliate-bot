<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Amazon Affiliate Bot</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
</head>
<body class="center">
  <div class="card login-card">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    <h1>Affiliate Bot</h1>
    <p class="muted">Sign in to manage posts, schedules and credentials.</p>
    {% if error %}<div class="alert alert-error"><strong>{{ error }}</strong></div>{% endif %}
    <form method="post" action="/login">
      <label style="text-align:left">
        Password
        <input type="password" name="password" autofocus required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
    </form>
  </div>
</body>
</html>
