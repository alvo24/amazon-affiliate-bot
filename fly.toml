# fly.toml — rename `app` below before `fly launch`.
app = "amazon-affiliate-bot"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/app.db"

[[mounts]]
  source = "affiliate_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
